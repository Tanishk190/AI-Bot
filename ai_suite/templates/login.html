<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DocuMind — Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <style>
      html, body { overflow: auto; }
      .login-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 24px;
        background: var(--color-background-page);
      }
      .login-card {
        background: var(--color-background-primary);
        border: 1px solid var(--color-border-tertiary);
        border-radius: var(--border-radius-lg);
        padding: 40px 36px;
        width: 100%;
        max-width: 392px;
        box-shadow: var(--shadow-md);
      }
      .login-brand {
        display: flex; align-items: center; justify-content: center;
        width: 48px; height: 48px; margin-bottom: 18px;
        border-radius: 12px;
        background: var(--brand);
        color: #fff; font-size: 22px;
      }
      .login-card h1 {
        font-size: 23px;
        font-weight: 750;
        letter-spacing: -.01em;
        margin-bottom: 6px;
        color: var(--color-text-primary);
      }
      .login-card p {
        font-size: 13.5px;
        color: var(--color-text-secondary);
        margin-bottom: 26px;
      }
      .login-card label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--color-text-secondary);
        margin-bottom: 6px;
      }
      .login-card input[type="email"],
      .login-card input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--color-border-secondary);
        border-radius: var(--border-radius-md);
        background: var(--color-background-primary);
        color: var(--color-text-primary);
        font-size: 14px;
        margin-bottom: 18px;
        font-family: var(--font-sans);
        outline: none;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }
      .login-card input:focus { border-color: var(--brand); box-shadow: var(--ring); }
      .login-card button {
        width: 100%;
        padding: 12px;
        margin-top: 4px;
        background: var(--brand);
        color: #fff;
        border: none;
        border-radius: var(--border-radius-md);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: var(--font-sans);
        transition: background 150ms ease;
      }
      .login-card button:hover { background: var(--brand-hover); }
      .login-error {
        background: rgba(226, 84, 44, .12);
        color: var(--red);
        font-size: 13px;
        padding: 10px 13px;
        border-radius: var(--border-radius-md);
        margin-bottom: 18px;
      }
    </style>
  </head>
  <body>
    <div class="login-wrap">
      <form class="login-card" method="post" action="{{ url_for('login') }}">
        <div class="login-brand" aria-hidden="true">◈</div>
        <h1>DocuMind</h1>
        <p>Sign in to continue.</p>
        {% if error %}
          <div class="login-error">{{ error }}</div>
        {% endif %}
        <label for="email">Email</label>
        <input type="email" name="email" id="email" placeholder="you@example.com" autofocus required>
        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="Password" required>
        <button type="submit">Sign in</button>
      </form>
    </div>
  </body>
</html>
